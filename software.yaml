- title: "tidylfs"
  description: |
    **ONS Labour Force Survey**.  Stiches together individual files into one R data.frame, and adds descriptions for occupation, industry. Quality of life improvements like picking the correct weight variable from each quarterly dataset and turning it into a single column. Works for quarterly data from 1992, or the APS from 2004.
  github: https://github.com/wklimowicz/tidylfs/
  website: https://wklimowicz.github.io/tidylfs/
- title: "tidyusoc"
  description: |
    **Understanding Society/UK Household Longitudinal Study (UKHLS/BHPS)**. Joins waves together to create a single file, one per category (`indresp`, `youth`, etc.). Works on the entire dataset going back to wave 1 of the BHPS.
  github: https://github.com/wklimowicz/tidyusoc/
  website: https://wklimowicz.github.io/tidyusoc/
- title: "tidyashe"
  description: |
    **ONS Annual Survey of Hours and Earnings**. <i class="bi bi-exclamation-square"></i> Experimental. Adds descriptions to occupation and industry and stiches files together. Works for files as they are in DfE, but may not work elsewhere.
  github: https://github.com/wklimowicz/tidyashe/
